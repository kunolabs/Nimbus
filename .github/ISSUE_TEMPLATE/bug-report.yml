name: Bug Report
description: Report a reproducible Nimbus host bug with environment details and logs.
body:
  - type: textarea
    id: symptoms
    attributes:
      label: Bug Symptoms
      description: Describe what happens (the symptoms of the bug).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: host-os
    attributes:
      label: Host OS
      description: Select the operating system used by the streaming host.
      options:
        - Windows 11 25H2
        - Windows 11 24H2
        - Windows 11 23H2
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: host-gpu
    attributes:
      label: Host GPU and Driver
      description: Example: RTX 4080, NVIDIA 576.xx.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client Device and App
      description: Example: NVIDIA Shield TV Pro, Artemis v20.2.6, 4K 120 Hz HEVC HDR.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest sequence that triggers the issue.
      placeholder: |
        1. Start Nimbus
        2. Connect from ...
        3. Launch ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (Optional but Recommended)
      description: |
        If possible, attach exported logs to help diagnose the issue.
        Go to **Troubleshooting -> Export Logs** and upload the logs zip file here.
        Remove secrets, tokens, public IPs, and private hostnames before posting.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (Optional)
      description: Add a screenshot if it helps show the bug.
      render: image
