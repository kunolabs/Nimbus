name: Report a Crash
description: Nimbus crashed or generated a memory dump. Attach the crash bundle zip so we can investigate.
body:
  - type: markdown
    attributes:
      value: |
        ### How to export the crash bundle
        1. Open the Nimbus Web UI on the host machine.
        2. When the red crash banner appears on the Dashboard, click **Export Crash Bundle**  
           or go to **Troubleshooting -> Export Crash Bundle**.
        3. Attach the downloaded crash bundle below. During the early rebrand,
           the file name may still use an inherited upstream name such as
           `sunshine_crashbundle-*.zip`.

  - type: textarea
    id: summary
    attributes:
      label: Crash Summary
      description: Briefly describe what you were doing when Nimbus crashed.
      placeholder: Example - Nimbus crashed after launching Game XYZ while streaming in HDR.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce (if known)
      description: List any steps that reliably reproduce the crash.
      placeholder: |
        1. Start Nimbus
        2. Connect from Moonlight
        3. ...
    validations:
      required: false

  - type: textarea
    id: crash_bundle
    attributes:
      label: Crash Bundle Zip
      description: Drag and drop the exported crash bundle zip here.
      placeholder: Attach the crash bundle zip generated by the host Web UI.
    validations:
      required: true

  - type: textarea
    id: extra_info
    attributes:
      label: Additional Details (optional)
      description: Anything else that could help (recent configuration changes, overclocks, etc.).
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have exported the crash bundle using the host Web UI **Export Crash Bundle** action.
          required: true
        - label: I attached the crash bundle zip file to this issue.
          required: true
